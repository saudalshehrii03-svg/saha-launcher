<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../public/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden;-webkit-font-smoothing:antialiased}
body{position:relative;font-family:'Rubik','Noto Kufi Arabic',sans-serif;background:#07080d;color:#eef1f8}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.en{font-family:'Space Grotesk','Inter',sans-serif}
.bgx{position:absolute;inset:0;background:radial-gradient(45% 55% at 80% 0%,rgba(110,90,255,.22),transparent 70%),radial-gradient(40% 50% at 0% 100%,rgba(0,200,170,.14),transparent 70%),#07080d}
.amb{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(70px) saturate(1.4) brightness(.45);opacity:.9}
.g{background:rgba(255,255,255,.055);backdrop-filter:blur(30px) saturate(170%);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 30px 60px -30px rgba(0,0,0,.8)}
.side{position:absolute;top:16px;bottom:16px;right:16px;width:270px;border-radius:26px;padding:24px 16px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:12px;padding:0 10px 22px}
.logo .m{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#7c5cff,#00d4b4);display:grid;place-items:center;box-shadow:0 10px 30px -8px #7c5cff}
.logo b{font-size:24px;font-weight:800}.logo small{display:block;font-size:10px;letter-spacing:4px;color:rgba(238,241,248,.5)}
.ni{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:14px;font-size:15px;color:rgba(238,241,248,.65)}
.ni.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.ni .c{margin-right:auto;font-size:12px;color:rgba(238,241,248,.45)}
.lb{font-size:12px;color:rgba(238,241,248,.45);margin:18px 14px 8px;letter-spacing:.5px}
.pd{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;font-family:'Space Grotesk'}
.main{position:absolute;top:16px;bottom:16px;left:16px;right:302px}
.tb{display:flex;align-items:center;gap:12px;height:56px;margin-bottom:18px}
.srch{flex:1;max-width:460px;height:52px;border-radius:16px;display:flex;align-items:center;gap:10px;padding:0 18px;color:rgba(238,241,248,.5);font-size:15px}
.kbd{margin-right:auto;font-size:12px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.08)}
.ib{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.av{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#7c5cff,#00d4b4);display:grid;place-items:center;font-weight:800;font-size:18px}
.hero{height:330px;border-radius:28px;position:relative;overflow:hidden;background-size:cover;background-position:center}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(270deg,rgba(7,8,13,.9),rgba(7,8,13,.35) 55%,transparent),linear-gradient(0deg,rgba(7,8,13,.6),transparent 50%)}
.hero .tx{position:absolute;z-index:1;right:40px;bottom:36px;max-width:620px}
.k{font-size:13px;color:rgba(238,241,248,.75);display:flex;gap:8px;align-items:center;margin-bottom:10px}
.hero h1{font-size:64px;font-weight:800;line-height:1;margin-bottom:14px}
.stats{display:flex;gap:26px;margin-bottom:22px;font-size:14px;color:rgba(238,241,248,.7)}.stats b{display:block;font-size:20px;color:#fff;font-family:'Space Grotesk'}
.play{display:inline-flex;align-items:center;gap:12px;height:58px;padding:0 34px;border-radius:18px;font-size:18px;font-weight:700;color:#06120f;background:linear-gradient(135deg,#00e0bd,#6ef5ff);box-shadow:0 14px 40px -10px rgba(0,224,189,.7)}
.btn2{display:inline-flex;align-items:center;gap:10px;height:58px;padding:0 22px;border-radius:18px;font-size:15px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:9px;font-size:12.5px;font-weight:700;color:#fff}
.chips{display:flex;gap:8px;margin:22px 0 16px;align-items:center}.chip{height:38px;padding:0 16px;border-radius:12px;display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(238,241,248,.75)}
.chip.on{background:#fff;color:#07080d;font-weight:700;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:16px}
.gc{position:relative}.gc .p{aspect-ratio:3/4;border-radius:18px;background-size:cover;background-position:center;position:relative;overflow:hidden;box-shadow:0 18px 36px -18px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.1)}

.gc.hov .p::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.35)}
.gc .pb{position:absolute;z-index:3;top:50%;left:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:#00e0bd;color:#06120f;display:grid;place-items:center;box-shadow:0 10px 30px -6px #00e0bd}
/* detail */
.dbg{position:absolute;inset:0;background-size:cover;background-position:center}
.dbg::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(7,8,13,.88) 22%,rgba(7,8,13,.15) 62%,rgba(7,8,13,.3)),linear-gradient(0deg,#07080d 26%,transparent 62%)}
.dt{position:absolute;top:110px;right:40px;width:760px}
.dt h1{font-size:92px;font-weight:800;line-height:.95;margin:14px 0 18px;letter-spacing:-1px}
.dt p{font-size:16px;line-height:1.8;color:rgba(238,241,248,.72);margin:16px 0 24px}
.cards{position:absolute;bottom:40px;right:40px;left:40px;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px}
.cd{border-radius:24px;padding:22px}.cd h4{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between}.cd h4 a{font-size:13px;color:#00e0bd;font-weight:400}
.ach{display:flex;align-items:center;gap:12px;padding:8px 0}.ach i{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;font-style:normal}
.ach b{display:block;font-size:14px}.ach small{font-size:12px;color:rgba(238,241,248,.55)}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#00e0bd,#7c5cff)}
.row{display:flex;justify-content:space-between;padding:9px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,.06)}.row span{color:rgba(238,241,248,.55)}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px}.chart i{flex:1;border-radius:6px 6px 3px 3px;background:linear-gradient(0deg,rgba(124,92,255,.5),#00e0bd)}
/* launchers */
.lg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lc{border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.lc .h{display:flex;align-items:center;gap:14px}.lc .lo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;font-family:'Space Grotesk';box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.lc h3{font-size:18px;font-family:'Space Grotesk','Rubik'}.lc .s{font-size:12.5px;display:flex;align-items:center;gap:6px;margin-top:3px}
.ok{color:#2ee6a6}.warn{color:#ffc04d}.off{color:rgba(238,241,248,.45)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.lc .path{font-size:12px;direction:ltr;text-align:left;color:rgba(238,241,248,.5);background:rgba(0,0,0,.25);padding:8px 10px;border-radius:10px;font-family:'JetBrains Mono'}
.lc .ft{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.lc .n{font-size:30px;font-weight:800;font-family:'Space Grotesk'}.lc .n small{font-size:13px;font-weight:400;color:rgba(238,241,248,.55);font-family:'Rubik'}
.tg{width:48px;height:28px;border-radius:14px;background:rgba(255,255,255,.15);position:relative}.tg::after{content:'';position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff}.tg.on{background:#00c9a7}.tg.on::after{right:23px}
.scan{border-radius:22px;padding:22px 26px;display:flex;align-items:center;gap:22px;margin-bottom:18px}
.ring{width:64px;height:64px}
</style></head><body>

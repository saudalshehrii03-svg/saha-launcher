[package]
name = "saha-launcher"
version = "0.1.0"
description = "Saha: one launcher for every game library, account and mod"
edition = "2021"

[lib]
name = "saha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
